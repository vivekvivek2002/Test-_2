services:
  - type: web
    name: aura-ecommerce
    env: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn aura_core.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.6
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: aura-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CLOUDINARY_URL
        sync: false

databases:
  - name: aura-db
    databaseName: auradb
    user: aurauser
    plan: free
    region: oregon
